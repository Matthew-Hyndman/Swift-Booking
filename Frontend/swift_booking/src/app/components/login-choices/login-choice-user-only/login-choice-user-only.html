<h1>How would you like to proceed?</h1>
<div class="login-choice-layout" style="margin-top: 40px;">    
<hr>
<div class="col">
<h2>Want to book with a business?</h2>
  <div class="login-choice-card-container">
  <div class="login-choice-card">    
    <h2>Login as User</h2>
    <p>Access your account as a regular user. This will allow you to book with your favourite business swiftly.</p>
    <button (click)="loginAsUser()">Login as User</button>
</div>
  <div class="login-choice-card">
    <h2>Register as User</h2>
    <p>Create a new account as a regular user.</p>
    <button (click)="registerAsUser()">Register as User</button>
  </div>
    </div>
  </div>
</div>
