<div class="app-shell">
  <header class="topbar glass-panel">
    <div class="brand-container">
    <a routerLink="/"
      ><img
        class="brand-img"
        src="assets/images/swift_book_logo_And_Title_Transparent.png"
        alt="swift booking Logo"
    /></a>    
    <i class="hamburger fa-solid fa-bars" style="color: rgb(255, 255, 255);" (click)="toggleNavMenu()"></i>
    </div>
    <nav class="primary-navigation" aria-label="Primary navigation">
      @for (link of navLinks; track $index; let i = $index) {
        @if (link.enabled === true && specialLinks.indexOf(link.label) === -1) {
          <a 
          [routerLink]="link.path" 
          routerLinkActive="is-active"
          style="animation: fade-in-from-top 0.4s ease;"
          [style.animationDelay]="(i * 0.1) + 's'"
          >{{
            link.label
          }}</a>
        } @else if (link.enabled === true) {
          <!-- Special links like Login and Logout are handled separately -->
          @if (isLoggedIn) {
            <button
              type="button"
              class="ghost-button special-nav-link"
              (click)="logout()"
            >
              Logout
            </button>
          } @else {
            <button
              type="button"
              class="ghost-button special-nav-link"
              (click)="login()"
            >
              Login
            </button>
          }
        }
      }
    </nav>
    <div class="auth-actions">
      @if (isLoggedIn) {
        <button type="button" class="ghost-button" (click)="logout()">
          Logout
        </button>
      } @else {
        <button type="button" class="ghost-button" (click)="login()">
          Login
        </button>
      }
    </div>
  </header>

  <main class="page-container">
    <router-outlet></router-outlet>
  </main>
</div>
